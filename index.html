<!DOCTYPE html>

<head>

<title>Sömnregistrering</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f3f5f7;
    color: #263238;
    font-family: Arial, Helvetica, sans-serif;

<body>

<div class="container">

<header>

<h1>Sömnregistrering</h1>

<p class="intro">
Fyll i när han somnar och vaknar. Om han vaknar under natten
kan du lägga till en ny sömnperiod.
</p>

</header>


<!-- Alla sju nätter skapas här -->

<div id="nights"></div>


<!-- Veckosammanställning -->

<section class="weekly-summary">

<h2>Veckosammanställning</h2>

<div id="summary-list"></div>


<div class="totals">

<div>
Total sömn under veckan
</div>

<div
class="total-value"
id="total-sleep">
0 h 0 min
</div>


<div class="average">

Genomsnitt per natt:

<strong id="average-sleep">
0 h 0 min
</strong>

</div>

</div>

</section>

</div>



<script>

/*
==========================================================
NÄTTERNA
==========================================================
*/

const nights = [

    "Söndag → måndag",
    "Måndag → tisdag",
    "Tisdag → onsdag",
    "Onsdag → torsdag",
    "Torsdag → fredag",
    "Fredag → lördag",
    "Lördag → söndag"

];


const nightsContainer =
    document.getElementById("nights");



/*
==========================================================
SKAPA ALLA SJU NÄTTER
==========================================================
*/

nights.forEach((night, nightIndex) => {

    const nightElement =
        document.createElement("section");

    nightElement.className = "night";

    nightElement.innerHTML = `

        <h2>${night}</h2>

        <div
            class="periods"
            id="periods-${nightIndex}">
        </div>


        <button
            type="button"
            class="add-button"
            onclick="addPeriod(${nightIndex})">

            + Lägg till sömnperiod

        </button>


        <div
            class="summary"
            id="summary-${nightIndex}">

            <strong>Sammanställning</strong>

            Fyll i tiderna ovan.

        </div>

    `;


    nightsContainer.appendChild(nightElement);


    /*
    Varje natt börjar med en sömnperiod.
    */

    addPeriod(nightIndex);

});



/*
==========================================================
LÄGG TILL SÖMNPERIOD
==========================================================
*/

function addPeriod(nightIndex) {

    const container =
        document.getElementById(
            `periods-${nightIndex}`
        );


    const period =
        document.createElement("div");


    period.className = "period";


    period.innerHTML = `

        <div>

            <label>Somnade</label>

            <input
                type="time"
                class="sleep-start">

        </div>


        <div>

            <label>Vaknade</label>

            <input
                type="time"
                class="sleep-end">

        </div>


        <button
            type="button"
            class="remove-button"
            onclick="removePeriod(this)">

            Ta bort

        </button>

    `;


    container.appendChild(period);


    /*
    Uppdatera beräkningen direkt när
    användaren ändrar en tid.
    */

    period
        .querySelectorAll("input")
        .forEach(input => {

            input.addEventListener(
                "input",
                calculateEverything
            );

        });


    calculateEverything();
}



/*
==========================================================
TA BORT SÖMNPERIOD
==========================================================
*/

function removePeriod(button) {

    const period =
        button.closest(".period");


    const container =
        period.parentElement;


    /*
    Det måste alltid finnas minst
    en rad kvar.
    */

    if (container.children.length === 1) {

        period.querySelector(
            ".sleep-start"
        ).value = "";

        period.querySelector(
            ".sleep-end"
        ).value = "";

    } else {

        period.remove();

    }


    calculateEverything();
}



/*
==========================================================
KLOCKSLAG → MINUTER
==========================================================
*/

function timeToMinutes(time) {

    if (!time) {
        return null;
    }


    const [hours, minutes] =
        time.split(":").map(Number);


    return hours * 60 + minutes;
}



/*
==========================================================
MINUTER → TEXT
==========================================================
*/

function formatDuration(totalMinutes) {

    totalMinutes =
        Math.max(
            0,
            Math.round(totalMinutes)
        );


    const hours =
        Math.floor(totalMinutes / 60);


    const minutes =
        totalMinutes % 60;


    if (hours === 0 && minutes === 0) {
        return "0 min";
    }


    if (hours === 0) {
        return `${minutes} min`;
    }


    if (minutes === 0) {
        return `${hours} h`;
    }


    return `${hours} h ${minutes} min`;
}



/*
==========================================================
RÄKNA UT EN NATT
==========================================================
*/

function calculateNight(nightIndex) {

    const container =
        document.getElementById(
            `periods-${nightIndex}`
        );


    const periodElements =
        Array.from(
            container.querySelectorAll(".period")
        );


    const periods = [];


    /*
    previousEnd används för att kunna
    hantera midnatt korrekt.
    */

    let previousEnd = null;


    for (
        let i = 0;
        i < periodElements.length;
        i++
    ) {

        const startInput =
            periodElements[i]
                .querySelector(".sleep-start");


        const endInput =
            periodElements[i]
                .querySelector(".sleep-end");


        const start =
            timeToMinutes(
                startInput.value
            );


        const end =
            timeToMinutes(
                endInput.value
            );


        /*
        Helt tom rad.
        */

        if (
            start === null &&
            end === null
        ) {
            continue;
        }


        /*
        Bara ena tiden ifylld.
        */

        if (
            start === null ||
            end === null
        ) {

            return {
                error:
                    "Fyll i både somnade och vaknade."
            };

        }


        let adjustedStart = start;

        let adjustedEnd = end;


        /*
        FÖRSTA SÖMNPERIODEN
        */

        if (previousEnd === null) {

            if (
                adjustedEnd <= adjustedStart
            ) {

                adjustedEnd += 1440;

            }

        }


        /*
        EFTERFÖLJANDE SÖMNPERIODER
        */

        else {

            /*
            Flytta starttiden till nästa dygn
            om det behövs.
            */

            while (
                adjustedStart < previousEnd
            ) {

                adjustedStart += 1440;

            }


            adjustedEnd = end;


            while (
                adjustedEnd <= adjustedStart
            ) {

                adjustedEnd += 1440;

            }

        }


        const duration =
            adjustedEnd - adjustedStart;


        /*
        En period kan inte vara längre
        än 24 timmar.
        */

        if (duration > 1440) {

            return {
                error:
                    "En sömnperiod är längre än 24 timmar. Kontrollera tiderna."
            };

        }


        /*
        Kontrollera överlappning.
        */

        if (
            previousEnd !== null &&
            adjustedStart < previousEnd
        ) {

            return {
                error:
                    "Sömnperioderna överlappar varandra."
            };

        }


        periods.push({

            start: adjustedStart,

            end: adjustedEnd,

            duration: duration

        });


        previousEnd = adjustedEnd;

    }


    /*
    Ingen sömn registrerad.
    */

    if (periods.length === 0) {

        return {

            empty: true,

            totalSleep: 0,

            totalAwake: 0

        };

    }


    /*
    Räkna vakenperioderna.
    */

    const awakePeriods = [];


    for (
        let i = 1;
        i < periods.length;
        i++
    ) {

        const awake =
            periods[i].start -
            periods[i - 1].end;


        if (awake > 0) {

            awakePeriods.push(awake);

        }

    }


    /*
    Total sömn.
    */

    const totalSleep =
        periods.reduce(
            (sum, period) =>
                sum + period.duration,
            0
        );


    /*
    Total vaken tid.
    */

    const totalAwake =
        awakePeriods.reduce(
            (sum, minutes) =>
                sum + minutes,
            0
        );


    return {

        empty: false,

        periods: periods,

        totalSleep: totalSleep,

        totalAwake: totalAwake

    };

}



/*
==========================================================
RÄKNA UT HELA VECKAN
==========================================================
*/

function calculateEverything() {

    const summaryList =
        document.getElementById(
            "summary-list"
        );


    summaryList.innerHTML = "";


    let totalWeekSleep = 0;


    nights.forEach(
        (night, nightIndex) => {

            const result =
                calculateNight(
                    nightIndex
                );


            const summaryElement =
                document.getElementById(
                    `summary-${nightIndex}`
                );


            /*
            FEL
            */

            if (result.error) {

                summaryElement.className =
                    "summary error";


                summaryElement.innerHTML = `

                    <strong>
                        Kontrollera tiderna
                    </strong>

                    ${result.error}

                `;


                addWeeklySummary(
                    night,
                    result.error
                );


                return;

            }


            /*
            TOM NATT
            */

            if (result.empty) {

                summaryElement.className =
                    "summary";


                summaryElement.innerHTML = `

                    <strong>
                        Sammanställning
                    </strong>

                    Ingen sömn registrerad.

                `;


                addWeeklySummary(
                    night,
                    "Ej ifyllt"
                );


                return;

            }


            /*
            Lägg till i veckans total.
            */

            totalWeekSleep +=
                result.totalSleep;


            /*
            Sömnperioderna.
            */

            const sleepText =
                result.periods
                    .map(
                        period =>
                            formatDuration(
                                period.duration
                            )
                    )
                    .join(" + ");


            /*
            Vaken tid.
            */

            let awakeText = "";


            if (
                result.totalAwake > 0
            ) {

                awakeText =
                    `, vaken ${formatDuration(
                        result.totalAwake
                    )}`;

            }


            /*
            Exempel:

            Sömn 5 h 14 min + 4 h,
            vaken 20 min
            */

            const summaryText =
                `Sömn ${sleepText}${awakeText}`;


            summaryElement.className =
                "summary";


            summaryElement.innerHTML = `

                <strong>
                    Sammanställning
                </strong>

                ${summaryText}

            `;


            addWeeklySummary(
                night,
                summaryText
            );

        }
    );


    /*
    TOTAL VECKOSÖMN
    */

    document.getElementById(
        "total-sleep"
    ).textContent =
        formatDuration(
            totalWeekSleep
        );


    /*
    GENOMSNITT
    */

    const average =
        totalWeekSleep / 7;


    document.getElementById(
        "average-sleep"
    ).textContent =
        formatDuration(
            average
        );

}



/*
==========================================================
VECKOSAMMANSTÄLLNING
==========================================================
*/

function addWeeklySummary(
    night,
    text
) {

    const summaryList =
        document.getElementById(
            "summary-list"
        );


    const row =
        document.createElement("div");


    row.className =
        "summary-row";


    row.innerHTML = `

        <div class="summary-night">
            ${night}
        </div>

        <div>
            ${text}
        </div>

    `;


    summaryList.appendChild(row);

}



/*
==========================================================
STARTA
==========================================================
*/

calculateEverything();


/*
==========================================================
INGEN LAGRING
==========================================================

Sidan använder inte:

- localStorage
- sessionStorage
- cookies
- databas

Sömnuppgifterna sparas alltså inte av sidan.

==========================================================
*/

</script>

</body>
</html>
